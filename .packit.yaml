# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: .packit_rpm/dfuzzer.spec

files_to_sync:
    - .packit.yaml
    - src: .packit_rpm/dfuzzer.spec
      dest: dfuzzer.spec

upstream_package_name: dfuzzer
downstream_package_name: dfuzzer
upstream_project_url: https://github.com/dbus-fuzzer/dfuzzer
upstream_tag_template: "v{version}"
csmock_args: --cppcheck-add-flag=--enable=style -t clang

actions:
  post-upstream-clone:
    # Use the Fedora Rawhide specfile
    - "git clone https://src.fedoraproject.org/rpms/dfuzzer .packit_rpm --depth=1"
    # Drop the "sources" file so rebase-helper doesn't think we're a dist-git
    - "rm -fv .packit_rpm/sources"
    - sed -i '1 i%define _unpackaged_files_terminate_build 0' .packit_rpm/dfuzzer.spec
    - sed -i 's/^%meson$/%meson --fatal-meson-warnings --werror -Ddfuzzer-test-server=true/' .packit_rpm/dfuzzer.spec

jobs:
- job: copr_build
  trigger: pull_request
  metadata:
    targets:
    - fedora-all-aarch64
    - fedora-all-armhfp
    - fedora-all-i386
    - fedora-all-ppc64le
    - fedora-all-s390x
    - fedora-all-x86_64
- job: copr_build
  trigger: commit
  metadata:
    targets:
    - fedora-all-aarch64
    - fedora-all-armhfp
    - fedora-all-i386
    - fedora-all-ppc64le
    - fedora-all-s390x
    - fedora-all-x86_64
